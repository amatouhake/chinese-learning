name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Test production guards without Cloudflare credentials
        env:
          CLOUDFLARE_API_KEY: ""
          CLOUDFLARE_API_TOKEN: ""
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: >-
          bun test
          tests/unit/access-auth.test.ts
          tests/unit/api.test.ts
          tests/unit/production-artifacts.test.ts
          tests/unit/production-config.test.ts
          tests/unit/production-verifier.test.ts

      - name: Run the repository quality gate
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: bun run check

  browser:
    name: Browser
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out pinned vocabulary corpus
        uses: actions/checkout@v5
        with:
          repository: drkameleon/complete-hsk-vocabulary
          ref: 7ac65bf1a6387d35f1ade478906172a19311c7f9
          path: .generated/sources/complete-hsk-vocabulary

      - name: Check out pinned v1 enrichment corpus
        uses: actions/checkout@v5
        with:
          repository: amatouhake/why-learn-languages-when-we-have-llms-lol
          ref: 6bd4b8dfc45a97fdeca20efeeab0d6d81d236847
          path: .generated/sources/v1-source

      - name: Check out pinned pronunciation media
        uses: actions/checkout@v5
        with:
          repository: hugolpz/audio-cmn
          ref: ff9ed3d0c631195bd2c06f39450f3264c7124040
          path: .generated/sources/audio-cmn
          sparse-checkout: |
            64k/hsk
            README.md

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browser
        run: bun run browser:install:ci

      - name: Run isolated Playwright dogfood tests
        run: >-
          bun run test:browser --
          --vocabulary-root .generated/sources/complete-hsk-vocabulary
          --v1-root .generated/sources/v1-source
          --audio-root .generated/sources/audio-cmn

  corpus:
    name: Corpus integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether full corpus verification is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$base" "$GITHUB_SHA" -- \
            .github/workflows/ci.yml \
            bun.lock \
            migrations \
            package.json \
            scripts \
            src/db \
            src/domain \
            tests/unit/full-import-verification.test.ts \
            wrangler.jsonc; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pinned vocabulary corpus
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: drkameleon/complete-hsk-vocabulary
          ref: 7ac65bf1a6387d35f1ade478906172a19311c7f9
          path: .generated/sources/complete-hsk-vocabulary

      - name: Check out pinned v1 enrichment corpus
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: amatouhake/why-learn-languages-when-we-have-llms-lol
          ref: 6bd4b8dfc45a97fdeca20efeeab0d6d81d236847
          path: .generated/sources/v1-source

      - name: Check out pinned pronunciation media
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: hugolpz/audio-cmn
          ref: ff9ed3d0c631195bd2c06f39450f3264c7124040
          path: .generated/sources/audio-cmn
          sparse-checkout: |
            64k/hsk
            README.md

      - name: Install Bun
        if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies from lockfile
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Verify complete corpus import
        if: steps.scope.outputs.run == 'true'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: >-
          bun run verify:corpus --
          --vocabulary-root .generated/sources/complete-hsk-vocabulary
          --v1-root .generated/sources/v1-source

      - name: Verify pronunciation corpus and media
        if: steps.scope.outputs.run == 'true'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: >-
          bun run verify:pronunciation --
          --vocabulary-root .generated/sources/complete-hsk-vocabulary
          --v1-root .generated/sources/v1-source
          --audio-root .generated/sources/audio-cmn

      - name: Record intentional corpus skip
        if: steps.scope.outputs.run != 'true'
        run: echo "Corpus inputs are unchanged; scheduled verification remains authoritative."
